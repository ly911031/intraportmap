name: Android APK Release

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          & (Get-Command sdkmanager.bat).Source 'platforms;android-36' 'build-tools;36.1.0' 'ndk;27.3.13750724'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          python -m pip install --target .build-tools/python cmake==3.31.6 ninja==1.11.1.4
          if ($LASTEXITCODE -ne 0) { throw 'CMake/Ninja installation failed' }
      - name: Cache pinned dependency sources
        uses: actions/cache@v4
        with:
          path: |
            .build-tools/ss-deps
            .build-tools/libevent-2.1.12-stable
          key: android-sources-${{ runner.os }}-${{ hashFiles('android/prepare-shadowsocks.py', '.github/workflows/android-release.yml') }}
      - name: Prepare dependency sources
        run: |
          if (!(Test-Path .build-tools/libevent-2.1.12-stable/CMakeLists.txt)) {
            Invoke-WebRequest 'https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz' -OutFile .build-tools/libevent.tar.gz
            $hash=(Get-FileHash .build-tools/libevent.tar.gz -Algorithm SHA256).Hash
            if ($hash -ne '92E6DE1BE9EC176428FD2367677E61CEFFC2EE1CB119035037A27D346B0403BB') { throw 'libevent checksum mismatch' }
            tar -xzf .build-tools/libevent.tar.gz -C .build-tools
            if ($LASTEXITCODE -ne 0) { throw 'libevent extraction failed' }
          }
          python android/prepare-shadowsocks.py
          if ($LASTEXITCODE -ne 0) { throw 'Shadowsocks dependency preparation failed' }
      - name: Host regression tests
        run: ./android/test-host.ps1 -Java $env:JAVA_HOME
      - name: Restore fixed release signing key
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          if (!$env:ANDROID_RELEASE_SIGNING) { throw 'Missing ANDROID_RELEASE_SIGNING secret; refusing random signing' }
          $signing=$env:ANDROID_RELEASE_SIGNING | ConvertFrom-Json
          if (!$signing.keystore -or !$signing.password -or $signing.alias -ne 'intraportmap-release' -or $signing.cert_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid signing configuration' }
          Write-Output "::add-mask::$($signing.password)"
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/android/release.keystore",[Convert]::FromBase64String($signing.keystore))
          "ANDROID_STORE_PASSWORD=$($signing.password)" >> $env:GITHUB_ENV
          "ANDROID_KEY_PASSWORD=$($signing.password)" >> $env:GITHUB_ENV
          "ANDROID_CERT_SHA256=$($signing.cert_sha256)" >> $env:GITHUB_ENV
      - name: Build and verify APK
        run: ./android/build.ps1 -Sdk $env:ANDROID_HOME -Java $env:JAVA_HOME -Ndk "$env:ANDROID_HOME/ndk/27.3.13750724" -KeyStore "$env:GITHUB_WORKSPACE/android/release.keystore" -KeyAlias intraportmap-release -RequireSigningKey
      - name: Verify fixed signing identity
        run: |
          $cert="$env:RUNNER_TEMP/intraportmap-release.der"
          & "$env:JAVA_HOME/bin/keytool.exe" -exportcert -keystore android/release.keystore -storepass:env ANDROID_STORE_PASSWORD -alias intraportmap-release -file $cert
          if ($LASTEXITCODE -ne 0) { throw 'Cannot export release certificate' }
          $actual=(Get-FileHash $cert -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ANDROID_CERT_SHA256) { throw 'Release signing identity changed' }
          "Release certificate SHA-256: $actual" | Set-Content dist/SIGNING-CERT.txt -Encoding ascii
      - name: APK checksum
        run: |
          $apk='dist/intraportmap-shadowsocks-android.apk'
          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  intraportmap-shadowsocks-android.apk" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraportmap-android
          path: |
            dist/intraportmap-shadowsocks-android.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERT.txt
          if-no-files-found: error
      - name: Choose release tag
        id: release
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/android-v')) {
            $tag='${{ github.ref_name }}'
          } else {
            [xml]$manifest=Get-Content android/AndroidManifest.xml
            $version=$manifest.manifest.GetAttribute('versionName','http://schemas.android.com/apk/res/android')
            $tag="android-v$version-build.${{ github.run_number }}.${{ github.run_attempt }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: IntraPortMap Android ${{ steps.release.outputs.tag }}
          prerelease: false
          make_latest: true
          body: |
            Android 5.0+ APK, including IntraPortMap and Shadowsocks server. Android 5 runtime compatibility still requires device validation.
            Uses the fixed release signing certificate; subsequent fixed-signature releases support in-place updates.
            One-time migration from older random CI/local signatures requires backup and uninstall before installation.
          generate_release_notes: true
          files: |
            dist/intraportmap-shadowsocks-android.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERT.txt
      - name: Remove temporary signing key
        if: always()
        run: Remove-Item -LiteralPath android/release.keystore -ErrorAction SilentlyContinue
